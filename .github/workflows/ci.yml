name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Also downloads the MongoDB binary used by the in-memory API tests.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Unit tests (web) and API tests (in-memory MongoDB)
        run: pnpm test

      - run: pnpm build
